[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_error.log

[program:rpyc_server]
command=/usr/bin/python3 /opt/mt5/rpyc_mt5_server.py
environment=DISPLAY=":99",WINEARCH="win64",WINEPREFIX="/root/.wine"
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/var/log/supervisor/rpyc_server.log
stderr_logfile=/var/log/supervisor/rpyc_server_error.log

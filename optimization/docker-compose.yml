version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # MT5 Terminal with Wine + VNC + Compile API
  # ═══════════════════════════════════════════════════════════════
  mt5_terminal:
    build:
      context: ./mt5
      dockerfile: Dockerfile
    container_name: optima_mt5
    ports:
      - "3000:3000"
      - "8001:8001"
      - "8080:8080"   # Compile API
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
      - VNCPASSWORD=trading
    volumes:
      - ./data:/data
      - mt5_config:/config
    networks:
      - optima_network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # Optima Dashboard (Python/Streamlit)
  # ═══════════════════════════════════════════════════════════════
  optima_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: optima_dashboard
    ports:
      - "8501:8501"   # Streamlit UI
    volumes:
      - ./data:/data
      - ./lib:/app/lib
      - ./dashboard.py:/app/dashboard.py
    environment:
      - MT5_API_URL=http://mt5_terminal:8080
      - DATA_DIR=/data
    depends_on:
      - mt5_terminal
    networks:
      - optima_network
    restart: unless-stopped

volumes:
  mt5_config:

networks:
  optima_network:
    driver: bridge

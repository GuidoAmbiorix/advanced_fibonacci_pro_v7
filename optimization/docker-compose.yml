version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # MT5 Terminal with Wine + VNC + Compile API
  # ═══════════════════════════════════════════════════════════════
  mt5_terminal:
    build:
      context: ./mt5
      dockerfile: Dockerfile
    container_name: optima_mt5
    ports:
      - "5900:5900"   # VNC Access
      - "6080:6080"   # noVNC Web Access (Browser)
      - "8080:8080"   # Compile API
    volumes:
      - ./data:/data
      - mt5_wine:/home/mt5/.wine  # Persist Wine/MT5 installation
    environment:
      - DISPLAY=:0
    networks:
      - optima_network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # Optima Dashboard (Python/Streamlit)
  # ═══════════════════════════════════════════════════════════════
  optima_dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: optima_dashboard
    ports:
      - "8501:8501"   # Streamlit UI
    volumes:
      - ./data:/data
      - ./lib:/app/lib
      - ./dashboard.py:/app/dashboard.py
    environment:
      - MT5_API_URL=http://mt5_terminal:8080
      - DATA_DIR=/data
    depends_on:
      - mt5_terminal
    networks:
      - optima_network
    restart: unless-stopped

volumes:
  mt5_wine:

networks:
  optima_network:
    driver: bridge

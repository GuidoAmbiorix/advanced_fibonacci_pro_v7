version: "3.8"
services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
      - "8001:8001"  # API port
      - "8501:8501"  # Dashboard port
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      - mt5_config:/config
      - type: bind
        source: ./portafolio_manager
        target: /config/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts/portafolio_manager
        read_only: false
      # Mount API bridge code
      - type: bind
        source: ./mt5_api_bridge
        target: /app/mt5_api_bridge
        read_only: false
      # Mount dashboard code
      - type: bind
        source: ./streamlit_project
        target: /app/streamlit_project
        read_only: false
      # Startup script
      - type: bind
        source: ./start_services.sh
        target: /app/start_services.sh
        read_only: false
    networks:
      vpn_network:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: unless-stopped
    command: ["/app/start_services.sh"]

volumes:
  mt5_config:

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.13.0/24
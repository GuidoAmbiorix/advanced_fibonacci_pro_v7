services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
      - VNCPASSWORD=trading
      - WINEDLLOVERRIDES=mscoree,mshtml=
      - WINEPREFIX=/config/.wine
    volumes:
      - mt5_config:/config
      - ./portafolio_manager:/config/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts/portafolio_manager
    networks:
      vpn_network:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped

volumes:
  mt5_config:

networks:
  vpn_network:
    external: true
    name: wireguard-vpn_vpn_network

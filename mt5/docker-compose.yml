version: "3.8"

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading

    volumes:
      # 1️⃣ Persistent MT5 data
      - mt5_config:/config

      # 2️⃣ Strategy source code (bind mount)
      - type: bind
        source: ./portafolio_manager
        target: /config/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts/portafolio_manager
        read_only: true   # 🔥 IMPORTANT

    restart: unless-stopped

volumes:
  mt5_config:

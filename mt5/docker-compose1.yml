version: "3.8"
services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      - mt5_config:/config
      # NOW add your local folder
      - type: bind
        source: ./portafolio_manager
        target: /config/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts/portafolio_manager
        read_only: false
    networks:
      vpn_network:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped

volumes:
  mt5_config:

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.13.0/24
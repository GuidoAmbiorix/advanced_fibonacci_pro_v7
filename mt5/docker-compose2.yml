version: "3.8"

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      - mt5_config:/config
    networks:
      vpn_network:
        ipv4_address: 10.50.0.20
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped

volumes:
  mt5_config:

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24

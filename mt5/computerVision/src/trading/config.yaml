# Trading Configuration
# NOTE: Most user-facing settings are now in the Dashboard (Trading Control page)
# This file contains only infrastructure and complex settings

# MT5 Bridge
bridge:
  url: "http://10.0.0.4:5000"

# Broker Settings
trade:
  slippage_pips: 20 # Broker-specific setting
  default_lot_size: 0.01

# Auto-Trader
auto_trader:
  enabled: false # Start disabled for safety
  check_interval_seconds: 60 # How often to check for new signals
  symbols:
    # Major Pairs
    - EURUSD
    - GBPUSD
    - USDJPY
    - USDCHF
    - AUDUSD
    - USDCAD
    - NZDUSD
    # Cross Pairs
    - EURJPY
    - GBPJPY
    - EURGBP
    - AUDJPY
    # Commodities
    - XAUUSD

# Prediction Settings
prediction:
  regeneration_interval_seconds: 300 # Generate new predictions every 5 minutes
  max_prediction_age_seconds: 600 # Max age before prediction is considered stale
  min_data_bars: 100 # Minimum bars needed for prediction

# Killzone Settings
killzones:
  enabled: false
  timezone: "Europe/Athens" # FundingPips uses GMT+2 (EET/EEST)

  # Phase 6: Advanced Features
  max_spread_pips: 3.0 # Maximum allowed spread in pips

  # Holiday calendar (YYYY-MM-DD format) - trading disabled on these dates
  holidays:
    - "2026-01-01" # New Year's Day
    - "2026-12-25" # Christmas
    # Add more holidays as needed

  # Per-symbol overrides (optional)
  symbol_overrides:
    # Gold (XAUUSD) - Best during high liquidity periods
    XAUUSD:
      enabled: true
      windows:
        - name: "Gold London Open"
          start: "10:00"
          end: "12:00"
          days: [0, 1, 2, 3, 4]
        - name: "Gold London-NY Overlap"
          start: "14:00"
          end: "17:00"
          days: [0, 1, 2, 3, 4]
        - name: "Gold NY Mid-Session"
          start: "17:00"
          end: "20:00"
          days: [0, 1, 2, 3, 4]

    # Japanese Yen pairs - Best during Tokyo and major sessions
    USDJPY:
      enabled: true
      windows:
        - name: "Tokyo Session"
          start: "03:00"
          end: "12:00"
          days: [0, 1, 2, 3, 4]
        - name: "NY Session"
          start: "14:00"
          end: "19:00"
          days: [0, 1, 2, 3, 4]

    EURJPY:
      enabled: true
      windows:
        - name: "Tokyo Session"
          start: "03:00"
          end: "12:00"
          days: [0, 1, 2, 3, 4]
        - name: "London Session"
          start: "10:00"
          end: "17:00"
          days: [0, 1, 2, 3, 4]

  # Define active trading windows (FundingPips broker time = GMT+2)
  # Days: 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
  windows:
    # Asian Session (Tokyo)
    - name: "Tokyo Open"
      start: "03:00" # 01:00 GMT = 03:00 GMT+2
      end: "07:00" # 05:00 GMT = 07:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: medium
      optimal_pairs: ["USDJPY", "AUDJPY", "NZDJPY", "EURJPY"]

    - name: "Tokyo Close"
      start: "10:00" # 08:00 GMT = 10:00 GMT+2
      end: "12:00" # 10:00 GMT = 12:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["USDJPY", "EURJPY", "GBPJPY"]

    # European Session (London)
    - name: "London Open"
      start: "10:00" # 08:00 GMT = 10:00 GMT+2
      end: "12:00" # 10:00 GMT = 12:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["EURUSD", "GBPUSD", "EURGBP", "EURJPY"]

    - name: "London Mid-Session"
      start: "12:00" # 10:00 GMT = 12:00 GMT+2
      end: "14:00" # 12:00 GMT = 14:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: medium
      optimal_pairs: ["EURUSD", "GBPUSD", "XAUUSD"]

    - name: "London-NY Overlap"
      start: "14:00" # 12:00 GMT = 14:00 GMT+2
      end: "17:00" # 15:00 GMT = 17:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["EURUSD", "GBPUSD", "XAUUSD", "USDCAD"]

    - name: "London Close"
      start: "17:00" # 15:00 GMT = 17:00 GMT+2
      end: "19:00" # 17:00 GMT = 19:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["GBPUSD", "EURGBP", "EURUSD"]

    # American Session (New York)
    - name: "NY Open"
      start: "14:00" # 12:00 GMT = 14:00 GMT+2
      end: "17:00" # 15:00 GMT = 17:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["EURUSD", "GBPUSD", "USDCAD", "USDCHF"]

    - name: "NY Mid-Session"
      start: "17:00" # 15:00 GMT = 17:00 GMT+2
      end: "20:00" # 18:00 GMT = 20:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: medium
      optimal_pairs: ["USDCAD", "USDCHF", "XAUUSD"]

    - name: "NY Close"
      start: "20:00" # 18:00 GMT = 20:00 GMT+2
      end: "22:00" # 20:00 GMT = 22:00 GMT+2
      days: [0, 1, 2, 3, 4]
      priority: high
      optimal_pairs: ["USDCAD", "USDCHF"]

# Exit Strategy Settings (defaults, overridden by dashboard)
exit_strategies:
  # Breakeven Stop
  breakeven_enabled: true
  breakeven_ratio: 1.0 # Move to BE after 1:1 R:R

  # Partial Profit Taking
  partial_profit_enabled: true
  partial_profit_ratio: 0.5 # Take profit at 50% of TP
  partial_close_percent: 0.5 # Close 50% of position

  # Trailing Stop (ATR-based)
  trailing_stop_enabled: true
  atr_period: 14 # ATR calculation period

  # Killzone Exit
  close_on_killzone_end: false # Keep positions open after killzone

# Risk Management Settings
# These settings can be overridden by Dashboard configuration
risk:
  risk_per_trade_pct: 1.0
  max_positions: 3
  min_confidence: 0.70
  max_daily_loss_pct: 5.0

# Signal Confirmation Settings (NEW!)
# Prevents immediate trade execution - validates signals first
signal_confirmation:
  enabled: true # Set to false to disable confirmation system

  # Confirmation window (how long to wait before validating signal)
  confirmation_window_seconds: 180 # 3 minutes (H1 timeframe)

  # Minimum confirmation score to execute (0-100)
  min_confirmation_score: 45  # Balanced threshold with new partial credit scoring

  # Scoring weights (7 factors, sum to 100)
  # UPDATED: Boost model_confidence (ML is primary alpha), balanced other factors
  weights:
    model_confidence: 20 # ML model prediction confidence (BOOSTED - primary signal)
    mtf_alignment: 20 # Multi-timeframe trend alignment (with partial credit)
    momentum_confluence: 18 # RSI, MACD, Stochastic (with partial credit)
    trend_strength: 15 # ADX and DI alignment
    volume_confirmation: 12 # Volume supporting move
    fibonacci_alignment: 8 # OTE zones, retracements, confluence
    smc_confluence: 7 # Order Blocks, FVG, BOS, CHoCH

  # Multi-timeframe validation
  mtf_validation:
    enabled: true
    require_htf_alignment: false  # Don't strictly require HTF alignment (partial credit)
    min_htf_count: 2 # Check at least 2 higher timeframes

  # Momentum confirmation
  momentum_validation:
    enabled: true
    require_rsi_alignment: false  # Don't strictly require (partial credit)
    require_macd_alignment: false  # Don't strictly require (partial credit)
    require_stochastic_alignment: false # Optional

  # Volume validation
  volume_validation:
    enabled: true
    min_volume_ratio: 1.2 # Volume must be 1.2x average

  # Trend strength validation
  trend_validation:
    enabled: true
    min_adx: 20 # Minimum ADX for trend strength
    require_di_alignment: true

  # Fibonacci validation (NEW! ✨)
  fibonacci_validation:
    enabled: true
    swing_lookback: 50 # Bars to look back for swing high/low
    min_confluence_distance_pips: 5 # Pips for Fib level confluence
    require_ote_zone: false # Don't strictly require OTE zone
    min_fib_score: 40 # Minimum Fibonacci score (0-100)

  # Smart Money Concepts validation (NEW! ✨)
  smc_validation:
    enabled: true
    order_block_lookback: 50 # Bars to detect order blocks
    fvg_min_gap_ratio: 0.0001 # Minimum gap size for Fair Value Gap
    bos_lookback: 30 # Bars for Break of Structure detection
    require_premium_discount: false # Don't strictly require premium/discount zone
    min_smc_score: 40 # Minimum SMC score (0-100)

  # Confluence requirements
  min_confluence_factors: 3 # Need at least 3 confirming factors

# Cooldown Settings (NEW!)
# Prevents overtrading and revenge trading
cooldowns:
  enabled: true

  # Per-symbol cooldown after trade
  symbol_cooldown_minutes: 60 # 1 hour for H1 timeframe (1 bar)

  # Extended cooldown after loss
  loss_cooldown_minutes: 180 # 3 hours after stop loss (3 bars)

  # Minimum time between ANY trades
  global_cooldown_minutes: 15 # 15 minutes between any trades

  # Cooldown after multiple rapid signals (prevent over-trading)
  rapid_signal_threshold: 3 # More than 3 signals in window
  rapid_signal_cooldown_minutes: 120 # 2 hour cooldown

# Fallback Defaults (only used if database is empty)
# All these settings are now managed in the Dashboard
defaults:
  position_sizing_method: "risk_based"
  trading_timeframe: "H1" # Default to H1
  atr_multiplier: 1.0 # H1 default
  max_hold_minutes: 1440 # 24 hours for H1

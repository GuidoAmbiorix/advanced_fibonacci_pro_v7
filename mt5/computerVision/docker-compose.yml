version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cv_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=cv_trading
      - POSTGRES_USER=cv_agent
      - POSTGRES_PASSWORD=123
      - POSTGRES_HOST_AUTH_METHOD=md5
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_agent -d cv_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cv_network

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: cv_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Use Windows host IP instead of host.docker.internal
      - BRIDGE_URL=http://10.0.0.4:5000
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=${DATABASE_URL}
    deploy:
      resources:
        limits:
          cpus: '8'  # Use up to 8 CPU cores
          memory: 12G  # Use up to 12GB RAM
        reservations:
          cpus: '4'  # Reserve at least 4 cores
          memory: 6G  # Reserve at least 6GB RAM
    restart: unless-stopped
    networks:
      - cv_network
    depends_on:
      postgres:
        condition: service_healthy

  # Auto-Trader Service
  trader:
    build:
      context: .
      dockerfile: Dockerfile.trader
    container_name: cv_trader
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./src/trading/config.yaml:/app/src/trading/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
      - BRIDGE_URL=http://10.0.0.4:5000
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    networks:
      - cv_network
    depends_on:
      postgres:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  postgres_data:
    driver: local

networks:
  cv_network:
    driver: bridge

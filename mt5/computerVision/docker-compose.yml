version: '3.8'

networks:
  trading-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mt5_data:
    driver: local
  redis_data:
    driver: local

services:
  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:16-alpine
    container_name: cv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cv_trading}
      POSTGRES_USER: ${DB_USER:-cv_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./volumes/backups:/backups
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cv_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb  # Shared memory for PostgreSQL performance

  # ==================== PostgreSQL Backup (Automated) ====================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: cv_postgres_backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME:-cv_trading}
      POSTGRES_USER: ${DB_USER:-cv_agent}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"  # Daily at midnight
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./volumes/backups:/backups
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== Redis Cache (Optional but Recommended) ====================
  redis:
    image: redis:7-alpine
    container_name: cv_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== MT5 Terminal (Wine + noVNC) ====================
  mt5-terminal:
    build:
      context: .
      dockerfile: dockerfiles/mt5-wine.Dockerfile
    container_name: cv_mt5_terminal
    restart: unless-stopped
    environment:
      DISPLAY_WIDTH: 1920
      DISPLAY_HEIGHT: 1080
      VNC_PASSWORD: ${VNC_PASSWORD}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - mt5_data:/root/.wine/drive_c/Program Files/MetaTrader 5
      - ./configs/mt5:/config:ro
    ports:
      - "6080:8080"  # noVNC web interface
      - "5900:5900"  # VNC direct access (optional)
    networks:
      - trading-network
    shm_size: 512mb  # Shared memory for X11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== MT5 Bridge (Flask API) ====================
  bridge:
    build:
      context: .
      dockerfile: dockerfiles/bridge.Dockerfile
    container_name: cv_bridge
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cv_agent}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cv_trading}
      FLASK_ENV: production
      MT5_TERMINAL_HOST: mt5-terminal
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./bridge:/app/bridge:ro
      - ./volumes/logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
      mt5-terminal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Auto Trader (Python) ====================
  trader:
    build:
      context: .
      dockerfile: dockerfiles/trader.Dockerfile
    container_name: cv_trader
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cv_agent}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cv_trading}
      BRIDGE_URL: http://bridge:5000
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    volumes:
      - ./src:/app/src:ro
      - ./volumes/logs:/app/logs
      - ./models:/app/models:ro  # ML models (read-only)
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # ==================== Dashboard (Streamlit) ====================
  dashboard:
    build:
      context: .
      dockerfile: dockerfiles/dashboard.Dockerfile
    container_name: cv_dashboard
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cv_agent}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-cv_trading}
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - ./dashboard:/app/dashboard:ro
    ports:
      - "8501:8501"
    networks:
      - trading-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Nginx Reverse Proxy (Optional) ====================
  nginx:
    image: nginx:alpine
    container_name: cv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - trading-network
    depends_on:
      - dashboard
      - mt5-terminal

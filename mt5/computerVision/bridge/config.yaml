# MT5 Bridge Configuration

# MT5 Connection
mt5:
  login: 0  # Set your MT5 login
  password: ""  # Set your MT5 password
  server: ""  # Set your MT5 server
  timeout: 60000  # Connection timeout in ms

# Data Sync
sync:
  enabled: true
  interval_seconds: 60  # Fetch data every 60 seconds
  symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
  timeframe: H1  # H1, M15, M5, etc.
  bars_to_fetch: 1000

# API Server
api:
  host: "0.0.0.0"
  port: 5000
  debug: false

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: logs/mt5_bridge.log

version: "3.8"
services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"
      - "8001:8001"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      # Use ONLY managed volume on first run
      - mt5_config:/config
    networks:
      vpn_network:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: unless-stopped

volumes:
  mt5_config:

networks:
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.13.0/24
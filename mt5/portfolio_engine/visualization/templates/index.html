<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #131722; color: #d1d4dc; margin: 0; padding: 20px; }
        .topbar { display: flex; justify-content: space-between; margin-bottom: 20px; background: #1e222d; padding: 10px; border-radius: 5px; }
        .metric { text-align: center; }
        .metric-label { font-size: 0.8em; color: #787b86; }
        .metric-value { font-size: 1.2em; font-weight: bold; }
        #charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 80vh; }
        .chart-box { background: #1e222d; border-radius: 5px; padding: 10px; display: flex; flex-direction: column; }
        .chart-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .chart-element { flex-grow: 1; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="metric"><div class="metric-label">Equity</div><div class="metric-value" id="equity">Loading...</div></div>
        <div class="metric"><div class="metric-label">Balance</div><div class="metric-value" id="balance">Loading...</div></div>
        <div class="metric"><div class="metric-label">PnL</div><div class="metric-value" id="profit">Loading...</div></div>
    </div>

    <div id="charts-container">
        <!-- Charts injected here -->
    </div>

    <script>
        const symbols = {{!symbols}}; // Injected by Bottle
        const charts = {};
        const series = {};

        function createChart(symbol) {
            const container = document.createElement('div');
            container.className = 'chart-box';
            
            const header = document.createElement('div');
            header.className = 'chart-header';
            header.innerHTML = `<span>${symbol}</span><span>M15</span>`;
            container.appendChild(header);
            
            const chartDiv = document.createElement('div');
            chartDiv.className = 'chart-element';
            chartDiv.id = `chart-${symbol}`;
            container.appendChild(chartDiv);
            
            document.getElementById('charts-container').appendChild(container);

            const chart = LightweightCharts.createChart(chartDiv, {
                layout: { background: { type: 'solid', color: '#1e222d' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
                timeScale: { timeVisible: true, secondsVisible: false },
            });

            const candleSeries = chart.addCandlestickSeries();
            
            charts[symbol] = chart;
            series[symbol] = candleSeries;
            
            return { chart, candleSeries };
        }

        // Initialize charts
        symbols.forEach(sym => createChart(sym));

        async function updateData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Update Metrics
                if (data.account && data.account.equity !== undefined) {
                    document.getElementById('equity').innerText = '$' + data.account.equity.toFixed(2);
                    document.getElementById('balance').innerText = '$' + data.account.balance.toFixed(2);
                    document.getElementById('profit').innerText = '$' + data.account.profit.toFixed(2);
                } else {
                     document.getElementById('equity').innerText = 'Connecting...';
                     document.getElementById('balance').innerText = '...';
                     document.getElementById('profit').innerText = '...';
                }

                // Update Charts
                for (const [symbol, candles] of Object.entries(data.ohlcv)) {
                    if (series[symbol]) {
                        // Use update() for last candle, or setData for full history on first load
                        // For simplicity, we setData roughly logic or just last candle if existing
                        // Optimized: simple setData for now to ensure sync
                        series[symbol].setData(candles);
                    }
                }
            } catch (e) {
                console.error("Update failed", e);
            }
        }

        // Initial load and polling
        updateData();
        setInterval(updateData, 2000); // Poll every 2s
        
        // Resize observer
        new ResizeObserver(entries => {
            for (let entry of entries) {
                const symbol = entry.target.id.replace('chart-', '');
                if (charts[symbol]) {
                    charts[symbol].resize(entry.contentRect.width, entry.contentRect.height);
                }
            }
        }).observe(document.body);
        
    </script>
</body>
</html>

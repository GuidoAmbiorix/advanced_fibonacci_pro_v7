# Symbol Configuration
# Each symbol has its own parameters for the confluence ladder

symbols:
  XAUUSD:
    enabled: true
    timeframe: M15
    magic_number: 100001
    correlation_group: METALS

    # Fibonacci
    swing_lookback: 20
    fib_level_low: 0.618
    fib_level_high: 0.786
    zone_tolerance: 0.25 # × ATR

    # RSI
    rsi_period: 14
    rsi_oversold: 45
    rsi_overbought: 55
    rsi_momentum: true

    # Trend
    ema_period: 200
    ema_min_slope: 0.1 # × ATR

    # Displacement
    use_displacement: true
    displacement_atr: 1.2
    displacement_lookback: 5

    # Chop filter
    use_chop_filter: true
    chop_threshold: 0.75
    atr_ma_period: 20
    min_range_efficiency: 0.4

    # Session (UTC hours)
    session_filter: LONDON_NY
    london_start: 7
    london_end: 16
    ny_start: 12
    ny_end: 21

    # Special parameters for Gold
    spread_multiplier: 1.5 # Gold has wider spreads

  NAS100:
    enabled: true
    timeframe: M15
    magic_number: 100002
    correlation_group: INDICES

    swing_lookback: 20
    fib_level_low: 0.618
    fib_level_high: 0.786
    zone_tolerance: 0.3

    rsi_period: 14
    rsi_oversold: 45
    rsi_overbought: 55
    rsi_momentum: true

    ema_period: 200
    ema_min_slope: 0.15

    use_displacement: true
    displacement_atr: 1.5 # Indices need bigger displacement
    displacement_lookback: 5

    use_chop_filter: true
    chop_threshold: 0.7
    atr_ma_period: 20
    min_range_efficiency: 0.35

    session_filter: NY_ONLY # Focus on US session for indices
    ny_start: 13
    ny_end: 21

  GBPJPY:
    enabled: true
    timeframe: M15
    magic_number: 100003
    correlation_group: JPY

    swing_lookback: 20
    fib_level_low: 0.618
    fib_level_high: 0.786
    zone_tolerance: 0.25

    rsi_period: 14
    rsi_oversold: 45
    rsi_overbought: 55
    rsi_momentum: true

    ema_period: 200
    ema_min_slope: 0.1

    use_displacement: true
    displacement_atr: 1.2
    displacement_lookback: 5

    use_chop_filter: true
    chop_threshold: 0.75
    atr_ma_period: 20
    min_range_efficiency: 0.4

    session_filter: LONDON_NY # Active in both sessions
    london_start: 7
    london_end: 16
    ny_start: 12
    ny_end: 21

# Correlation Groups
correlation_groups:
  USD:
    symbols: [EURUSD, GBPUSD, USDJPY, XAUUSD, USDCHF]
    max_exposure: 1.0 # %

  JPY:
    symbols: [USDJPY, GBPJPY, EURJPY, AUDJPY]
    max_exposure: 1.0

  GBP:
    symbols: [GBPUSD, GBPJPY, EURGBP, GBPCAD]
    max_exposure: 0.8

  METALS:
    symbols: [XAUUSD, XAGUSD]
    max_exposure: 0.8

  INDICES:
    symbols: [NAS100, US30, SP500, DAX40]
    max_exposure: 1.2

# Session Definitions (UTC)
sessions:
  LONDON:
    start: 7
    end: 16

  NY:
    start: 12
    end: 21

  LONDON_NY:
    # Overlap is 12-16 UTC - best for forex
    use_overlap_boost: true

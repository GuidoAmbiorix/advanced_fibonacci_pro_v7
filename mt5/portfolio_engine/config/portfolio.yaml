# Portfolio Governor Configuration
# Controls risk, drawdown, and exposure limits

# Portfolio-wide limits
portfolio:
  max_total_exposure: 2.0 # % - Max total risk across all symbols
  max_symbol_exposure: 0.6 # % - Max risk per symbol
  max_group_exposure: 1.0 # % - Max risk per correlation group
  max_positions: 6 # Total positions across all symbols
  max_positions_per_symbol: 3 # Max positions per single symbol

# Drawdown Governor
drawdown:
  # Trading state based on DD level
  normal: 3.0 # DD < 3% = Normal trading
  reduced: 5.0 # DD 3-5% = Reduced risk (50%)
  pause: 8.0 # DD > 8% = Pause all new trades

  # Risk multipliers
  reduced_multiplier: 0.5 # When DD exceeds 'normal'
  severe_multiplier: 0.25 # When DD approaches 'pause'

# Profit Factor Governor
profit_factor:
  # Rolling window for PF calculation
  rolling_trades: 30

  # PF-based risk scaling
  excellent: 2.5 # PF > 2.5 = Can increase risk slightly
  normal: 1.8 # PF 1.8-2.5 = Normal trading
  reduced: 1.2 # PF 1.2-1.8 = Reduced risk
  pause: 1.0 # PF < 1.0 = Pause trading

  # Risk multipliers
  excellent_multiplier: 1.1
  normal_multiplier: 1.0
  reduced_multiplier: 0.7
  minimum_trades: 20 # Need at least 20 trades for PF to be meaningful

# Equity Curve Protection
equity:
  # Peak equity tracking
  reset_peak_on_new_high: true

  # Recovery mode
  recovery_mode_enabled: true
  recovery_risk_reduction: 0.5 # When in DD, reduce risk by 50%

  # Daily limits
  daily_loss_limit: 2.0 # % - Stop trading if daily loss exceeds
  daily_profit_target: 5.0 # % - Optional: reduce risk after big day

# Update frequency
update:
  interval_seconds: 5 # How often to recalculate metrics
  log_interval: 60 # How often to log status to file

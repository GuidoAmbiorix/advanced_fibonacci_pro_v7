# Risk Configuration
# Controls position sizing and trade management

# Base Risk Settings
base_risk:
  entry_risk: 0.25 # % - Initial entry risk
  addon1_risk: 0.15 # % - First add-on risk
  addon2_risk: 0.10 # % - Second add-on risk

# Confluence Ladder
confluence:
  min_entry_score: 4 # Minimum score (out of 6) to enter
  addon1_min_score: 4 # Required score for first add-on
  addon2_min_score: 5 # Required score for second add-on (stricter)

  # Score components (each worth 1 point):
  # 1. Trend aligned (EMA + slope)
  # 2. Structure valid (swing order)
  # 3. Fib golden zone
  # 4. RSI confirmation
  # 5. RSI momentum
  # 6. Displacement present

# Add-on Triggers
addons:
  enabled: true
  addon1_r: 1.5 # Add at +1.5R profit
  addon2_r: 2.5 # Add at +2.5R profit
  max_total_positions: 3 # Per symbol

# Stop Loss
stop_loss:
  atr_multiplier: 1.0 # SL = ATR × this value
  min_pips: 10 # Minimum SL in pips
  max_pips: 100 # Maximum SL in pips

# Take Profit / Trailing
exit_strategy:
  mode: TRAIL_RUNNER # TRAIL_OFF, TRAIL_RUNNER, TRAIL_FULL

  # Partial TP (for TRAIL_RUNNER mode)
  partial_tp_r: 1.5 # Close partial at this R
  partial_close_pct: 40 # Close 40% of position

  # Break-even
  be_threshold_r: 1.8 # Move to BE after this R

  # Trailing
  trail_start_r: 2.0 # Start trailing after this R
  trail_atr_mult: 1.2 # Trail distance = ATR × this

  # Runner TP
  runner_tp_r: 0 # 0 = unlimited (let trail decide)

# Position Sizing Methods
sizing:
  method: FIXED_PERCENT # FIXED_PERCENT, FIXED_LOT, KELLY

  # For FIXED_LOT method
  fixed_lot_size: 0.01

  # For KELLY method (advanced)
  kelly_fraction: 0.25 # Use 25% of Kelly (conservative)
  max_kelly_risk: 2.0 # Cap Kelly at 2%

# Spread Control
spread:
  max_spread_points: 50 # Skip if spread > this
  spread_factor: 1.5 # Multiply spread for exotic pairs

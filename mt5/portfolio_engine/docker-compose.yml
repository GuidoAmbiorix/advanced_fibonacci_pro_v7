services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: trading_mt5
    ports:
      - "3000:3000"   # VNC
      - "8001:8001"   # Internal Bridge (RPyC)
      - "8002:8002"   # Sidecar (RPyC Extended)
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
      - VNCPASSWORD=trading
      - TZ=America/New_York
      - WINEDEBUG=-all
    volumes:
      - mt5_config:/config
      - ./execution:/app
      - ./startup.sh:/custom-cont-init.d/99-fix-deps:ro
      - ../portafolio_manager:/mnt/experts
      - mt5_reports:/reports
    networks:
      - trading_network
    restart: unless-stopped
    mem_limit: 8G
    mem_reservation: 4G
    shm_size: '2gb'

  portfolio_engine:
    build: .
    container_name: portfolio_engine
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - mt5_reports:/reports
    environment:
      - MT5_HOST=mt5
      - MT5_PORT=8002
      - PYTHONUNBUFFERED=1
    depends_on:
      - mt5
    networks:
      - trading_network
    restart: unless-stopped

networks:
  trading_network:
    driver: bridge

volumes:
  mt5_config:
  mt5_reports:
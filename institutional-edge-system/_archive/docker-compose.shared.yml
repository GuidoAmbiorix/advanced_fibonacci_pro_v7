version: '3.8'

services:
  # Message Broker for Signal Distribution
  rabbitmq:
    image: rabbitmq:3-management
    container_name: institutional_rabbitmq
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # SHARED MT5 TERMINAL (Disabled for Dedicated Mode)
  # ============================================================================
  # mt5_shared:
  #   image: gmag11/metatrader5_vnc:latest

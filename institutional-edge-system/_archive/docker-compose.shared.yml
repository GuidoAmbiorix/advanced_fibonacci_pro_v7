  #     - "3000:3000"   # VNC Web Interface 
  #     - "8001:8001"   # RPyC Server 
  #   environment:
  #     - CUSTOM_USER=trader
  #     - PASSWORD=trading
  #     - VNCPASSWORD=trading
  #   volumes:
  #     - mt5_shared_config:/config
  #   networks:
  #     - trading_network

# ============================================================================
# INSTANCE TEMPLATE - Docker Compose Configuration (Lightweight)
# ============================================================================
# This template creates backend + frontend ONLY.
# All backends connect to the SHARED MT5 terminal (mt5_shared) via RPyC.
version: '3.8'

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5_terminal_${INSTANCE_NAME:-main}
    ports:
      - "${VNC_PORT:-3000}:3000"   # VNC Web Interface
      - "${RPYC_PORT:-8001}:8001"   # RPyC Server
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
      - VNCPASSWORD=trading
    volumes:
      - mt5_config:/config
    restart: unless-stopped
    networks:
      - bot-net

  backend:
    build: ../../backend
    container_name: institutional_backend_{INSTANCE_NAME}
    ports:
      - "{API_PORT}:8000"
    environment:
      # Connect to SHARED MT5 terminal
      - MT5_HOST=mt5
      - MT5_PORT=8001
      # Account credentials (used for mt5.login() switching)
      - MT5_LOGIN={MT5_LOGIN}
      - MT5_PASSWORD={MT5_PASSWORD}
      - MT5_SERVER={MT5_SERVER}
      # Instance identification
      - INSTANCE_NAME={INSTANCE_NAME}
      - INSTANCE_NUMBER={INSTANCE_NUMBER}
      - DATABASE_URL=sqlite:///./data/instance_{INSTANCE_NUMBER}.db
      - CORS_ORIGINS=http://localhost,http://127.0.0.1
      - SECRET_KEY=institutional-edge-instance-{INSTANCE_NUMBER}
      - JWT_SECRET_KEY=institutional-edge-jwt-instance-{INSTANCE_NUMBER}
      # Multi-Account / Signal Distribution
      - RABBITMQ_HOST=institutional_rabbitmq
      - RABBITMQ_PORT=5672
      - INSTANCE_ROLE=${INSTANCE_ROLE:-SOLO}
      # Broker/Prop Firm Settings
      - MT5_SYMBOL_SUFFIX=${MT5_SYMBOL_SUFFIX}
      - MT5_SYMBOL_PREFIX=${MT5_SYMBOL_PREFIX}
      - MAX_DRAWDOWN_PERCENT=${MAX_DRAWDOWN_PERCENT}
      - MAX_DAILY_LOSS_PERCENT=${MAX_DAILY_LOSS_PERCENT}
      - ACCOUNT_TYPE=${ACCOUNT_TYPE}
    volumes:
      - backend_data_{INSTANCE_NAME}:/app/data
    restart: unless-stopped
    networks:
      - bot-net
      - trading_network

  frontend:
    build:
      context: ../../frontend
      args:
        - VITE_INSTANCE_NUMBER={INSTANCE_NUMBER}
        - VITE_API_BASE_URL=/instance/{INSTANCE_NUMBER}/api
        - VITE_SOCKET_URL=/instance/{INSTANCE_NUMBER}
        - VITE_INSTANCE_NAME={INSTANCE_NAME}
    container_name: institutional_frontend_{INSTANCE_NAME}
    ports:
      - "{WEB_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - trading_network

volumes:
  backend_data_{INSTANCE_NAME}:
  mt5_config:

networks:
  bot-net:
    external: true
  trading_network:
    external: true

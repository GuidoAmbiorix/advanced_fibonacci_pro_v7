
version: '3.8'

services:
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5_terminal_${INSTANCE_NAME:-main}
    ports:
      - "${VNC_PORT:-3000}:3000"   # VNC Web Interface
      - "${RPYC_PORT:-8001}:8001"   # RPyC Server
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
      - VNCPASSWORD=trading
    volumes:
      - mt5_config:/config
    restart: unless-stopped
    networks:
      - bot-net

  backend:
    build: ./backend
    container_name: institutional_backend_${INSTANCE_NAME:-main}
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MT5_HOST=mt5
      - MT5_PORT=8001
      - PGPASSWORD=secret
      - DATABASE_URL=sqlite:///./sql_app.db
      # Multi-Account / Signal Distribution
      - RABBITMQ_HOST=institutional_rabbitmq
      - RABBITMQ_PORT=5672
      - INSTANCE_ROLE=${INSTANCE_ROLE:-SOLO}
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
    depends_on:
      - mt5
    volumes:
      - ${PROJECT_ROOT_HOST:-.}/backend/app:/app/app
      - backend_data:/app/data
    networks:
      - bot-net
      - trading_network

  frontend:
    build: ./frontend
    container_name: institutional_frontend_${INSTANCE_NAME:-main}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bot-net

volumes:
  mt5_config:
  backend_data:

networks:
  bot-net:
    external: true
  trading_network:
    external: true

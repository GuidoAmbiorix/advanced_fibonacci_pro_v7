version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: institutional_edge_db
    environment:
      POSTGRES_DB: institutional_edge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - institutional_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: institutional_edge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - institutional_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: institutional_edge_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@institutional-edge.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - institutional_network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  institutional_network:
    driver: bridge

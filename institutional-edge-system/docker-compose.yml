version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: institutional_edge_db
    environment:
      POSTGRES_DB: institutional_edge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - institutional_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: institutional_edge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - institutional_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: institutional_edge_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@institutional-edge.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - institutional_network
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: institutional_edge_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/institutional_edge
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=institutional_edge
      - ALLOW_ORIGINS=["*"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - institutional_network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: institutional_edge_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - institutional_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  institutional_network:
    driver: bridge

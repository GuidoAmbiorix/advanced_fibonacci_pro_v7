version: '3.8'

# ============================================================================
# INSTITUTIONAL EDGE PRO - Docker Compose
# Infrastructure Only: PostgreSQL, Redis, RabbitMQ, pgAdmin
# Backend and Frontend run locally via batch files
# ============================================================================

services:
  # ==========================================================================
  # DATABASE - PostgreSQL 15
  # ==========================================================================
  postgres:
    image: postgres:15
    container_name: institutional-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: institutional_edge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # CACHE - Redis
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: institutional-edge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # MESSAGE QUEUE - RabbitMQ
  # ==========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: institutional-edge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ==========================================================================
  # DATABASE ADMIN - pgAdmin
  # ==========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: institutional-edge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - app-network
    depends_on:
      - postgres

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  app-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  pgadmin_data:

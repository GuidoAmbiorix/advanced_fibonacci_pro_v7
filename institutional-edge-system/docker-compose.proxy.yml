version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: institutional_nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    extra_hosts:
      # This allows nginx to access services on the host machine
      - "host.docker.internal:host-gateway"
    networks:
      - bot-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bot-net:
    external: true

volumes:
  nginx-logs:

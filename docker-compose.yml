services:
  # Service for FIRST RUN ONLY - Initializes Wine directory structure
  mt5-init:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5-init
    profiles: ["init"]
    ports:
      - "3000:3000"
      - "8000:8001"
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      - mt5_config_1:/config
    networks:
      mt5_network_v2:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # MT5 Single Instance - NORMAL OPERATION
  mt5:
    image: gmag11/metatrader5_vnc:latest
    container_name: mt5-1
    profiles: ["app"]
    ports:
      - "3000:3000"  # VNC web interface
      - "8000:8001"  # VNC port
    environment:
      - CUSTOM_USER=trader
      - PASSWORD=trading
    volumes:
      - mt5_config_1:/config
      - type: bind
        source: ./mt5/portafolio_manager
        target: /config/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts/portafolio_manager
        read_only: false
    networks:
      mt5_network_v2:
        ipv4_address: 10.13.13.20
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    restart: unless-stopped

volumes:
  mt5_config_1:

networks:
  mt5_network_v2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.13.0/24
